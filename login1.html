<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medical Login</title>
    <link rel="stylesheet" href="login1.css" />
    
</head>
<body>
    <div class="login-container">
        <div class="excited-welcome">Welcome Back! 🎉</div>
        <p>Welcome back, please login to your account.</p>

        <div class="social-login">
            <button class="google"><i class="fab fa-google"></i> Google</button>
            <button class="facebook"><i class="fab fa-facebook"></i> Facebook</button>
        </div>

        <div class="divider">
            <div class="line"></div>
            <span>Or</span>
            <div class="line"></div>
        </div>

        <div class="toggle-buttons">
            <button class="active">Sign In</button>
            <button>Registration</button>
        </div>

        <form class="login-form">
            <label>Phone/Email *</label>
            <input type="text" placeholder="Example" required />

            <label>Password *</label>
            <input type="password" placeholder="*" required />

            <a href="#">Forgot Password?</a>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="#">Create an Account</a>
        </div>
    </div>
</body>

</html>
